[project]
name = "marvin-media"
version = "1"
description = "The Media package for Marvin: a Recording entry for every audio and video file, and the worker kinds (media-…) that fill it."
readme = "README.md"
requires-python = ">=3.11"
# Runs on the generic Marvin worker (InnerOpen/marvin-worker), which is not on an index: the image has it (FROM marvin-worker-base), and the
# tests take a checkout next to this one (--with-editable ../MarvinWorker; see .github/workflows/tests.yml). ffmpeg and ffprobe on PATH.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mediajobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
# ruff's classic defaults, named so a newer ruff's wider defaults do not fail the copied Studio code (mediajobs/{ffmpeg,audio_measure,
# waveform,video}.py), which stays exactly as Studio has it until P6.
select = ["E4", "E7", "E9", "F"]
